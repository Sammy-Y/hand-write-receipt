name: CI

on:
  # push 只限 main：其他分支開 PR 後由 pull_request 觸發，否則同一個 commit 會跑兩次
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 同一分支有新 push 時取消還在跑的舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 型別檢查、單元測試、build、e2e
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 型別檢查（vue-tsc）
        run: npx vue-tsc -b

      - name: 單元／元件測試（Vitest）
        run: npm test

      - name: Production build（vite build）
        run: npx vite build

      - name: 還原 Playwright 瀏覽器快取
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安裝 Playwright（Chromium，含系統相依套件）
        run: npx playwright install --with-deps chromium

      - name: 端對端測試（Playwright）
        run: npm run test:e2e

      - name: 上傳 Playwright 測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
